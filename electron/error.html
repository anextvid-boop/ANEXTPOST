<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ANEXTPOST — Connection Recovery</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0B1220;
      color: #F3F6FA;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 620px;
      padding: 28px;
      border-radius: 14px;
      background: #121A2B;
      border: 1px solid #243049;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #60A5FA;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 20px;
      color: #F87171;
    }
    p {
      margin: 0 0 14px;
      color: #CBD5E1;
      font-size: 14px;
    }
    code {
      display: block;
      margin: 10px 0 18px;
      padding: 12px;
      border-radius: 8px;
      background: #090E1A;
      border: 1px solid #1E293B;
      color: #93C5FD;
      font-size: 12.5px;
      word-break: break-word;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    input[type="url"] {
      flex: 1;
      min-width: 240px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #2A3854;
      background: #090E1A;
      color: #F3F6FA;
      font-size: 13px;
    }
    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #2A3854;
      background: #1E293B;
      color: #F3F6FA;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary {
      background: #2563EB;
      border-color: #3B82F6;
    }
    button:hover { opacity: 0.92; }
    .status {
      margin-top: 12px;
      font-size: 12.5px;
      color: #94A3B8;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">ANEXTPOST Desktop</div>
    <h1 id="err-title">Unable to connect to ANEXTPOST</h1>
    <p id="err-details">The app could not reach the configured ANEXTPOST URL.</p>
    <code id="err-action">Run "pnpm run dev:desktop" locally, or switch to your live domain below.</code>

    <div class="row">
      <button class="primary" id="retry-btn">Retry Connection</button>
      <button id="diag-btn">Export Diagnostics</button>
    </div>

    <div class="row" style="margin-top: 18px;">
      <input type="url" id="url-input" placeholder="https://app.yourdomain.com or http://localhost:4200" />
      <button id="save-url-btn">Switch URL &amp; Open</button>
    </div>
    <div class="status" id="status-msg"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const titleEl = document.getElementById('err-title');
    const detailsEl = document.getElementById('err-details');
    const actionEl = document.getElementById('err-action');
    const urlInput = document.getElementById('url-input');
    const statusEl = document.getElementById('status-msg');

    if (params.get('title')) titleEl.textContent = params.get('title');
    if (params.get('details')) detailsEl.textContent = params.get('details');
    if (params.get('nextAction')) actionEl.textContent = params.get('nextAction');

    const bridge = window.anextpostDesktop;
    if (bridge) {
      bridge.getTargetUrl().then((url) => {
        if (url) urlInput.value = url;
      }).catch(() => {});

      bridge.onNetworkStatus((info) => {
        if (info && info.online) {
          statusEl.textContent = 'Network online — retrying connection...';
        }
      });
    }

    document.getElementById('retry-btn').addEventListener('click', () => {
      if (bridge) bridge.retryLoad();
    });

    document.getElementById('diag-btn').addEventListener('click', async () => {
      if (!bridge) return;
      try {
        const res = await bridge.exportDiagnostics();
        statusEl.textContent = res && res.path ? `Saved diagnostics: ${res.path}` : 'Diagnostics exported.';
      } catch (err) {
        statusEl.textContent = `Export failed: ${err.message || err}`;
      }
    });

    document.getElementById('save-url-btn').addEventListener('click', async () => {
      if (!bridge) return;
      const nextUrl = urlInput.value.trim();
      try {
        await bridge.setTargetUrl(nextUrl);
        statusEl.textContent = `Saved ${nextUrl}. Loading...`;
      } catch (err) {
        statusEl.textContent = err.message || 'Invalid URL (must start with http:// or https://)';
      }
    });
  </script>
</body>
</html>
