# Local dev infrastructure for ANEXTPOST (avoids container-name collisions with other local stacks)
services:
  anextpost-postgres:
    image: postgres:17-alpine
    container_name: anextpost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postsider-user
      POSTGRES_PASSWORD: postsider-password
      POSTGRES_DB: postsider-db-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - anextpost-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postsider-user -d postsider-db-local"]
      interval: 3s
      timeout: 3s
      retries: 10

  anextpost-redis:
    image: redis:7.2
    container_name: anextpost-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - anextpost-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  anextpost-postgres-data:
  anextpost-redis-data:
